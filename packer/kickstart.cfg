#version=RHEL10

# ───────────
# installer
# ─────────── 

# text-mode installer, packer builds headless so there is no GUI
text

# AlmaLinux10's install will not proceed past the EULA screen unattended without it
eula --agreed

# automatically reboot and eject the install media/isot after install
reboot --eject


# ────────────────────── 
# locale-keyboard-time
# ──────────────────────

# set the language to English (United States)
lang en_US.UTF-8

# set the keyboard layout to US
keyboard --vckeymap=us --xlayouts='us'

# set the timezone
timezone Asia/Manila --utc


# ─────────────── 
# package source 
# ─────────────── 

# AlmaLinux10 minimal iso does not ship both cloud-init or qemu-guest-agent. 
# AppStream is the repo that has both
repo --name="appstream" --baseurl=https://repo.almalinux.org/almalinux/10/AppStream/x86_64/os/


# ─────────── 
# networking 
# ─────────── 

# DHCP on whichever interface libvirt presents
# Assign IP address automatically on every future boot
network --bootproto=dhcp --device=link --activate --onboot=on

# firewall stays on, but ssh is explicitly allowed
firewall --enabled --service=ssh


# ────────── 
# accounts 
# ──────────

# root gets no password baked into the image
# a real root password is set up later by ansible from an encrypted vault
rootpw --lock

# the account packer/tf/ansible use to log in and do work
# groups=wheel makes it sudo capable
# --lock allows a no password login
# only authenticates by SSH key
user --name=syl --groups=wheel --lock --gecos="Pipeline automation user"


# ───────────────── 
# disk targeting 
# ─────────────────
# prevents kickstart from using unintended disk
ignoredisk --only-use=vda

# automatically re-initialize disks 
# with corrupt/unrecognized partition tables
zerombr

# creates fresh partition table
# wipes all existing data on drive vda
clearpart --all --initlabel --drives=vda


# ──────────────────────────────────── 
# disk partitioning (outside lvm) 
# ────────────────────────────────────

# both boot partitions must exist as real partitions
# the UEFI firmware and bootloaders both need to read them before LVM
part /boot/efi --fstype=efi --size=600 --ondisk=vda --fsoptions="umask=0077,shortname=winnt"

part /boot --fstype=xfs --size=1024 --ondisk=vda

# the rest of the disk becomes one physical volume
# --grow with no size cap means take all the space after
# both partitions above are set
part pv.01 --size=1 --grow --ondisk=vda


# ──────────────────────────────────── 
# disk partitioning (inside lvm) 
# ────────────────────────────────────

# create a volume group
volgroup vg_sys_b pv.01

# logical volumes
# root gets a floor (4gb) plus grow so it absorbs whatever space is left
# after all other lvs below take their portion
logvol / --vgname=vg_sys_b --name=lv_root --fstype=xfs --size=4096 --grow

logvol swap --vgname=vg_sys_b --name=lv_swap --fstype=swap --size=2048

# /var is isolated so application and package manager
# data will not fill up root
logvol /var --vgname=vg_sys_b --name=lv_var --fstype=xfs --size=3072 

# /var/tmp is because CIS hardening will later mount it noexec
# scripts can be written here but not executed
logvol /var/tmp --vgname=vg_sys_b --name=lv_var_tmp --fstype=xfs --size=1024 

# /var/log is isolated so a spam service
# or runaway fills this instead of root
logvol /var/log --vgname=vg_sys_b --name=lv_var_log --fstype=xfs --size=2048 

# so too many logs cannot crowd out the audit trail space
logvol /var/log/audit --vgname=vg_sys_b --name=lv_var_log_audit --fstype=xfs --size=1024

# /lv_srv on /srv is pair b's assigned extra lv
logvol /srv --vgname=vg_sys_b --name=lv_srv --fstype=xfs --size=1024


# ──────────── 
# packages 
# ──────────── 

%packages

# smallest reasonable base
@^minimal-environment

# required so this vm can seed its own identity later
# from a cloud-init ISO terraform attaches
cloud-init

# lets libvirt query the vm's real state
qemu-guest-agent

%end


# ──────────────
# post-install
# ──────────────

# --log writes everything this section does to a file INSIDE the new OS,
# set -x echoes every command into that log as it runs.
%post --log=/root/ks-post.log
set -x

# enable services
systemctl enable sshd.service qemu-guest-agent.service
systemctl enable cloud-init-local.service cloud-init.service cloud-config.service cloud-final.service

# plant the SSH keypair packer itself uses to connect for the
# rest of the build
install -d -m 0700 -o syl -g syl /home/syl/.ssh
cat > /home/syl/.ssh/authorized_keys <<'PUBKEY'
${build_ssh_public_key}
PUBKEY

# 0700 on the dir, 0600 on the file — SSH refuses to use a key file with
# looser permissions than this.
chmod 600 /home/syl/.ssh/authorized_keys
chown -R syl:syl /home/syl/.ssh

# set up passwordless sudo for the automation account
cat > /etc/sudoers.d/90-syl <<'SUDOEOF'
syl ALL=(ALL) NOPASSWD:ALL
SUDOEOF
chmod 440 /etc/sudoers.d/90-syl

# restrict cloud-init to only the NoCloud datasource (a local ISO disk).
# without this it tries AWS/Azure/GCP first, each timing out.
cat > /etc/cloud/cloud.cfg.d/99-datasource.cfg <<'CIEOF'
datasource_list: [ NoCloud, None ]
CIEOF

# wipe per-machine identity before this disk becomes the golden image.
: > /etc/machine-id
rm -f /etc/ssh/ssh_host_*


# leave no stale package metadata in the image
dnf clean all
%end
