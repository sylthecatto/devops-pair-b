---
- name: "APP_SERVICE | 0. Print the Company Name"
  ansible.builtin.debug:
    msg: This is the company name {{company_name}}.

- name: "APP_SERVICE | 1. Print deployment welcome message"
  ansible.builtin.debug:
    msg: "Starting deployment for service: {{app_name}} on environment {{env_type}}"

- name: "APP_SERVICE | 2. Ensure application config directory exists"
  ansible.builtin.file:
    path: "/tmp/app_service_config"
    state: directory
    mode: "0755"

- name: "APP_SERVICE | 3. Deploy app configuration"
  ansible.builtin.copy:
    dest: "/tmp/app_service_config/app-{{inventory_hostname}}.conf"
    content: |
      # Auto generated by ansible
      COMPANY_NAME={{company_name}}
      APP_NAME={{app_name}}
      APP_PORT={{app_port}}
      ENV_YTPE={{env_type}}
    mode: "0644"
  notify:
    - Restart App Service Handler

  # this is how you create directory using loop, instead of creating task manually
- name: "APP_SERVICE | Create an application subcategories"
  ansible.builtin.file:
    path: "/tmp/app_service_config/{{item}}"
    state: directory
    mode: "0755"

  loop:
    - "logs"
    - "data"
    - "backups"
    - "bin"
  notify:
    - Restart App Service Handler

  # conditional task
- name: "APP_SERVICE | Print the security warning!"
  ansible.builtin.debug:
    msg: "Security warning: Running on prod server"
  when: env_type == "production"

- name: "APP_SERVICE | print the db info"
  ansible.builtin.debug:
    msg: "Security warning: I applied secured the db"
  when: "'dbservers' in group_names"

  # store the out of task into variable using register
- name: "Check if the app config is exist"
  ansible.builtin.stat:
    path: "/tmp/app_service_config/app-{{inventory_hostname}}.conf"
  register: config_file_stat

  # checking if in there and the size of it
- name: "The placement of the config file and the size"
  ansible.builtin.debug:
    msg: "The file exist: {{config_file_stat.stat.exists}} and the size of it {{config_file_stat.stat.size}} bytes/"
